<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neural Network Topology & Real-Time Activation Simulator</title>
  <meta name="category" content="Sanuz">
  <meta name="date" content="Mar 24, 2026">
  <meta name="description" content="An interactive real-time neural network topology simulation with forward-pass activation wave propagation, dynamic weight perturbation, and velocity-verlet physics.">
  <meta name="tags" content="Neural Networks, Canvas API, Interactive Simulation, JavaScript, WebGL">
  <meta name="subtitle" content="Real-time forward propagation and node activation visualizer built with zero external dependencies">
  <meta name="read-time" content="Interactive App">
  <meta name="status" content="Live Standalone">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #0f172a 0%, #020617 100%);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding: 1.5rem;
    }
    header {
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid rgba(51, 65, 85, 0.6);
      padding-bottom: 1rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-family: monospace;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }
    button {
      background: #0f172a;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 0.45rem 0.9rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: monospace;
    }
    button:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .canvas-container {
      position: relative;
      flex: 1;
      min-height: 480px;
      width: 100%;
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid rgba(51, 65, 85, 0.8);
      background: #030712;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .stats-overlay {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 0.5rem;
      padding: 0.6rem 0.9rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      pointer-events: none;
    }
    .stats-overlay span {
      color: #38bdf8;
      font-weight: bold;
    }
    .info-footer {
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #64748b;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>
        <span class="badge">LIVE CANV</span>
        Neural Layer Activation Pipeline
      </h1>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem;">
        Hover nodes to inject high-voltage potential; click anywhere to broadcast an epoch wave.
      </p>
    </div>

    <div class="controls">
      <button id="btn-fire">Trigger Forward Pass</button>
      <button id="btn-perturb">Perturb Weights</button>
      <button id="btn-reset">Reset Layers</button>
    </div>
  </header>

  <div class="canvas-container">
    <canvas id="neural-canvas"></canvas>
    <div class="stats-overlay">
      <div>FPS: <span id="fps-val">60</span></div>
      <div>Synapses: <span id="synapse-count">0</span></div>
      <div>Active Pulses: <span id="pulse-count">0</span></div>
    </div>
  </div>

  <div class="info-footer">
    <span>Self-Contained Standalone HTML Artifact</span>
    <span>Runs in Iframe Sandbox without Parent Leakage</span>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('neural-canvas');
      const ctx = canvas.getContext('2d');
      const fpsEl = document.getElementById('fps-val');
      const synapseEl = document.getElementById('synapse-count');
      const pulseEl = document.getElementById('pulse-count');

      let width, height;
      const layers = [4, 6, 8, 6, 3];
      let nodes = [];
      let connections = [];
      let pulses = [];
      let mouse = { x: -1000, y: -1000 };

      function resize() {
        width = canvas.parentElement.clientWidth;
        height = canvas.parentElement.clientHeight || 500;
        canvas.width = width * window.devicePixelRatio;
        canvas.height = height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        initNetwork();
      }

      function initNetwork() {
        nodes = [];
        connections = [];
        pulses = [];

        const layerSpacing = width / (layers.length + 1);

        layers.forEach((count, lIdx) => {
          const x = layerSpacing * (lIdx + 1);
          const nodeSpacing = height / (count + 1);
          const layerNodes = [];

          for (let i = 0; i < count; i++) {
            const y = nodeSpacing * (i + 1);
            const node = {
              x,
              y,
              baseY: y,
              radius: 6,
              layer: lIdx,
              activation: Math.random() * 0.4 + 0.1,
              targetActivation: 0.2,
              glow: 0
            };
            layerNodes.push(node);
            nodes.push(node);
          }

          if (lIdx > 0) {
            const prevLayerNodes = nodes.filter(n => n.layer === lIdx - 1);
            prevLayerNodes.forEach(prev => {
              layerNodes.forEach(curr => {
                connections.push({
                  from: prev,
                  to: curr,
                  weight: (Math.random() - 0.5) * 2,
                  pulseRate: Math.random() * 0.02 + 0.01
                });
              });
            });
          }
        });

        synapseEl.textContent = connections.length;
      }

      function triggerForwardPass() {
        const inputNodes = nodes.filter(n => n.layer === 0);
        inputNodes.forEach(n => {
          n.activation = 1.0;
          n.glow = 1.0;
        });

        connections.forEach(conn => {
          if (conn.from.layer === 0) {
            pulses.push({
              conn,
              progress: 0,
              speed: 0.035 + Math.random() * 0.02
            });
          }
        });
      }

      function perturbWeights() {
        connections.forEach(c => {
          c.weight += (Math.random() - 0.5) * 0.8;
          c.weight = Math.max(-1.5, Math.min(1.5, c.weight));
        });
      }

      window.addEventListener('resize', resize);
      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });
      canvas.addEventListener('mouseleave', () => {
        mouse.x = -1000;
        mouse.y = -1000;
      });
      canvas.addEventListener('click', triggerForwardPass);

      document.getElementById('btn-fire').addEventListener('click', triggerForwardPass);
      document.getElementById('btn-perturb').addEventListener('click', perturbWeights);
      document.getElementById('btn-reset').addEventListener('click', initNetwork);

      let lastTime = performance.now();
      let frameCount = 0;
      let lastFpsUpdate = performance.now();

      function animate(now) {
        frameCount++;
        if (now - lastFpsUpdate > 500) {
          fpsEl.textContent = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
          frameCount = 0;
          lastFpsUpdate = now;
        }

        ctx.clearRect(0, 0, width, height);

        // Update & draw synapses
        connections.forEach(c => {
          const dx = c.to.x - c.from.x;
          const dy = c.to.y - c.from.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          const alpha = Math.min(0.8, Math.max(0.08, Math.abs(c.weight) * 0.4 + (c.from.activation * 0.3)));
          ctx.beginPath();
          ctx.moveTo(c.from.x, c.from.y);
          ctx.lineTo(c.to.x, c.to.y);
          ctx.strokeStyle = c.weight > 0 ? `rgba(16, 185, 129, ${alpha})` : `rgba(239, 68, 68, ${alpha})`;
          ctx.lineWidth = Math.abs(c.weight) * 1.5;
          ctx.stroke();
        });

        // Update pulses
        for (let i = pulses.length - 1; i >= 0; i--) {
          const p = pulses[i];
          p.progress += p.speed;

          const px = p.conn.from.x + (p.conn.to.x - p.conn.from.x) * p.progress;
          const py = p.conn.from.y + (p.conn.to.y - p.conn.from.y) * p.progress;

          ctx.beginPath();
          ctx.arc(px, py, 3.5, 0, Math.PI * 2);
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 10;
          ctx.fill();
          ctx.shadowBlur = 0;

          if (p.progress >= 1) {
            p.conn.to.activation = Math.min(1.0, p.conn.to.activation + 0.35);
            p.conn.to.glow = 1.0;

            const nextConns = connections.filter(c => c.from === p.conn.to);
            nextConns.forEach(nc => {
              if (Math.random() > 0.3) {
                pulses.push({
                  conn: nc,
                  progress: 0,
                  speed: 0.035 + Math.random() * 0.02
                });
              }
            });
            pulses.splice(i, 1);
          }
        }
        pulseEl.textContent = pulses.length;

        // Draw nodes
        nodes.forEach(n => {
          const dToMouse = Math.hypot(n.x - mouse.x, n.y - mouse.y);
          if (dToMouse < 60) {
            n.activation = Math.min(1.0, n.activation + 0.05);
            n.glow = 1.0;
          }

          n.activation *= 0.985;
          n.glow *= 0.96;

          const glowRadius = n.radius + (n.glow * 12);
          if (n.glow > 0.05) {
            ctx.beginPath();
            ctx.arc(n.x, n.y, glowRadius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(56, 189, 248, ${n.glow * 0.4})`;
            ctx.fill();
          }

          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          const r = Math.round(15 + n.activation * 40);
          const g = Math.round(23 + n.activation * 160);
          const b = Math.round(42 + n.activation * 210);
          ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
          ctx.strokeStyle = n.activation > 0.4 ? '#38bdf8' : '#334155';
          ctx.lineWidth = 1.8;
          ctx.fill();
          ctx.stroke();
        });

        // Ambient automatic pulse
        if (Math.random() < 0.03 && connections.length > 0) {
          const randConn = connections[Math.floor(Math.random() * connections.length)];
          pulses.push({
            conn: randConn,
            progress: 0,
            speed: 0.025 + Math.random() * 0.02
          });
        }

        requestAnimationFrame(animate);
      }

      resize();
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
